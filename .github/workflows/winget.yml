# Checks the winget manifests (packaging/winget) against a published release: validates them and
# installs the app from them on a Windows runner. Runs when the packaging changes, or by hand.
name: winget

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.7.0)'
        required: true
  push:
    branches: [dev]
    paths: ['packaging/winget/**', '.github/workflows/winget.yml']

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ inputs.version }}'
          if [ -z "$version" ]; then version=$(gh release view --json tagName -q .tagName); fi
          packaging/winget/make-manifests.sh "$version"
          echo "DIR=packaging/winget/manifests/i/ivanxfernandez/AppleMusicScrobbler/${version#v}" >> "$GITHUB_ENV"

      - name: winget available?
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Host '::warning::winget is not installed on this runner; skipping validation (the winget-pkgs bot validates pull requests anyway).'
            "SKIP=1" >> $env:GITHUB_ENV
          } else { winget --version }

      - name: Validate
        if: env.SKIP != '1'
        shell: pwsh
        run: winget validate --manifest $env:DIR

      - name: Install from the manifests
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget install --manifest $env:DIR --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Command AppleMusicScrobbler -ErrorAction SilentlyContinue
          if (-not $exe) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Links" -Filter 'AppleMusicScrobbler*' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw 'AppleMusicScrobbler command not found after install' }
          "Installed: $($exe.Source ?? $exe.FullName)"
