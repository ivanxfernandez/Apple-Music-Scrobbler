name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/AppleMusicScrobbler -c Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: AppleMusicScrobbler
          path: src/AppleMusicScrobbler/bin/Release/net48/AppleMusicScrobbler.exe
