name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build AppleMusicScrobbler.sln -c Release

      - name: Test
        run: dotnet test AppleMusicScrobbler.sln -c Release --no-build

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: AppleMusicScrobbler
          path: src/AppleMusicScrobbler/bin/Release/net48/AppleMusicScrobbler.exe

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: UNIVERSAL=1 ./build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AppleMusicScrobbler-macOS
          path: macos/build/AppleMusicScrobbler-macOS.zip
